<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeStockCI Admin — Tableau de bord</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-coquille" id="coquille">
    <div class="admin-contenu">
      <div class="admin-entete"><h1>Tableau de bord administrateur</h1></div>
      <div class="grille-kpi" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:24px;">
        <div class="kpi"><div class="libelle">Utilisateurs inscrits</div><div class="chiffre" id="kpi-total">—</div></div>
        <div class="kpi recolte"><div class="libelle">Utilisateurs actifs</div><div class="chiffre" id="kpi-actifs">—</div></div>
        <div class="kpi or"><div class="libelle">Abonnements mensuels</div><div class="chiffre" id="kpi-mensuel">—</div></div>
        <div class="kpi or"><div class="libelle">Abonnements annuels</div><div class="chiffre" id="kpi-annuel">—</div></div>
        <div class="kpi alerte"><div class="libelle">Abonnements expirés</div><div class="chiffre" id="kpi-expires">—</div></div>
      </div>
      <div class="carte">
        <h3 style="margin-top:0;">Derniers utilisateurs créés</h3>
        <table class="tableau" id="tableau-recents">
          <thead><tr><th>Boutique</th><th>Nom</th><th>Localité</th><th>Abonnement</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>

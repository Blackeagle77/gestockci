<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeStockCI Admin — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{background:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .carte-admin{background:var(--surface);border-radius:var(--radius-l);padding:30px;width:100%;max-width:380px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;}
  .carte-admin h1{margin:0;font-size:1.3rem;}
  .erreur{color:var(--alerte);font-size:.85rem;display:none;}
</style>
</head>
<body>
  <form class="carte-admin" id="form-admin">
    <div>
      <h1>GeStockCI — Espace administrateur</h1>
      <p class="sous-titre" style="color:var(--ink-soft);margin-top:4px;">Réservé à l'administrateur de la plateforme</p>
    </div>
    <div class="champ"><label>Adresse email</label><input type="email" id="email" required></div>
    <div class="champ"><label>Mot de passe</label><input type="password" id="mdp" required></div>
    <p class="erreur" id="erreur">Accès refusé — identifiants incorrects ou compte non administrateur.</p>
    <button class="btn btn-principal" type="submit">Se connecter</button>
  </form>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
